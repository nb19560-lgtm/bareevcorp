<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Страница не найдена | BAREEV CORP.</title>

  <!-- ИКОНКИ -->
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/favicon.png" />

  <!-- ШРИФТЫ -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #F9F8F5;
      --bg-surface: #FFFFFF;
      --accent: #22211F;
      --accent-hover: #4A4845;
      --accent-glow: rgba(34, 33, 31, 0.05);
      --text-muted: #85827D;
      --border-light: rgba(34, 33, 31, 0.08);
      --font-heading: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Inter', Arial, sans-serif;
      --radius-sm: 4px;
      --transition: color 0.3s ease, background-color 0.3s ease, border-color 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      min-height: 100vh; 
      background: var(--bg-main); 
      color: var(--accent); 
      font-family: var(--font-body); 
      font-weight: 300; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; transition: var(--transition); }

    /* Курсор */
    .cursor-dot { position: fixed; top: 0; left: 0; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; pointer-events: none; z-index: 9999; transform: translate(-50%, -50%); opacity: 0; transition: width 0.3s, height 0.3s, background-color 0.3s, opacity 0.3s; }
    .cursor-active .cursor-dot { opacity: 1; }
    .cursor-hover .cursor-dot { width: 48px; height: 48px; background: var(--accent-glow); border: 1px solid var(--accent); }
    @media (hover: none), (max-width: 992px) { .cursor-dot { display: none !important; } }

    /* Шапка */
    header { padding: 32px 0; border-bottom: 1px solid var(--border-light); }
    .container { width: min(calc(100% - 40px), 1320px); margin: 0 auto; }
    .brand { display: inline-flex; flex-direction: column; gap: 2px; line-height: 1; }
    .brand-main { font-family: var(--font-heading); font-size: 24px; font-weight: 500; letter-spacing: 0.02em; color: var(--accent); }
    .brand-sub { font-size: 8px; font-weight: 600; letter-spacing: 0.25em; text-transform: uppercase; color: var(--text-muted); }

    /* Контент 404 */
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px 0; }
    .error-card { text-align: center; max-width: 560px; padding: 0 20px; }
    .error-code { font-family: var(--font-heading); font-size: clamp(80px, 12vw, 140px); font-weight: 400; line-height: 0.9; color: var(--border-light); margin-bottom: 16px; user-select: none; }
    .error-title { font-family: var(--font-heading); font-size: clamp(32px, 4vw, 48px); font-weight: 400; line-height: 1.1; margin-bottom: 16px; }
    .error-title i { font-style: italic; color: var(--text-muted); }
    .error-desc { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px; }
    .error-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }

    /* Кнопки */
    .button { display: inline-flex; justify-content: center; align-items: center; padding: 0 32px; min-height: 52px; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; border: 1px solid var(--accent); color: var(--accent); background: transparent; border-radius: var(--radius-sm); }
    .button:hover { background: var(--accent-glow); }
    .button-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
    .button-accent:hover { background: var(--accent-hover); color: #fff; }

    /* Подвал */
    footer { padding: 32px 0; border-top: 1px solid var(--border-light); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>

  <div class="cursor-dot" id="cursorDot"></div>

  <header>
    <div class="container">
      <a class="brand" href="/">
        <span class="brand-main">BAREEV CORP.</span>
        <span class="brand-sub">CUSTOM SOLUTIONS</span>
      </a>
    </div>
  </header>

  <main>
    <div class="error-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Пространство <i>не найдено</i></h1>
      <p class="error-desc">Возможно, адрес страницы был изменён или она больше не существует. Вернитесь на главную, чтобы ознакомиться с нашими проектами.</p>
      <div class="error-actions">
        <a href="/" class="button button-accent">На главную страницу →</a>
        <a href="https://t.me/nebareev" target="_blank" rel="noopener noreferrer" class="button">Написать в Telegram</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <span>© 2026 Bareev Corp. · Студия архитектурной мебели</span>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Курсор
      const cDot = document.getElementById("cursorDot");
      if (window.matchMedia("(hover: hover)").matches && window.innerWidth > 992) {
        let mX = -100, mY = -100, cX = -100, cY = -100, cursorRAF = null;
        function animCursor() {
          cX += (mX - cX) * 0.2; cY += (mY - cY) * 0.2;
          cDot.style.left = cX + "px"; cDot.style.top = cY + "px";
          if (Math.abs(mX - cX) > 0.5 || Math.abs(mY - cY) > 0.5) cursorRAF = requestAnimationFrame(animCursor);
          else cursorRAF = null;
        }
        document.addEventListener("mousemove", e => {
          mX = e.clientX; mY = e.clientY; document.body.classList.add("cursor-active");
          if (!cursorRAF) cursorRAF = requestAnimationFrame(animCursor);
        });
        const interact = "a, button";
        document.addEventListener("mouseover", e => { if (e.target.closest(interact)) document.body.classList.add("cursor-hover"); });
        document.addEventListener("mouseout", e => { if (e.target.closest(interact)) document.body.classList.remove("cursor-hover"); });
      }
    });
  </script>

</body>
</html>
